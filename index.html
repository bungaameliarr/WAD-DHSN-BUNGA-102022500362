<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Rental Mobil - Armada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-utama">
        <h1>Sistem Informasi Rental Mobil</h1>
        <p>Modul Armada Kendaraan</p>
    </header>

    <nav class="menu-navigasi">
        <a href="index.html" class="link-menu link-aktif">Armada Kendaraan</a>
    </nav>

    <section class="kotak-konten">
        <h3>Tambah Data Kendaraan</h3>

        <form action="" method="POST">
            <p class="grup-input">
                <label for="plat" class="label-teks">Nomor Plat</label>
                <input type="text" id="plat" class="kotak-input">
            </p>

            <p class="grup-input">
                <label for="merek" class="label-teks">Merek Kendaraan</label>
                <input type="text" id="merek" class="kotak-input">
            </p>

            <p class="grup-input">
                <label for="transmisi" class="label-teks">Tipe Transmisi</label>
                <select id="transmisi" class="kotak-select">
                    <option value="">-- Pilih Transmisi --</option>
                    <option value="Manual">Manual</option>
                    <option value="Automatic">Automatic</option>
                </select>
            </p>

            <button type="submit" class="tombol-simpan">Simpan Data</button>
        </form>
    </section>

    <section class="kotak-konten">
        <h3>Data Armada Kendaraan</h3>

        <table class="tabel-data">
            <tr class="header-tabel">
                <th>NO</th>
                <th>NOMOR PLAT</th>
                <th>UNIT</th>
                 <th>TAHUN PEMBUATAN</th>
                <th>MEREK</th>
                <th>TRANSMISI</th> 
            </tr>
            <tr>
                <td>1</td>
                <td><strong>F 4114 MM</strong></td>
                  <td>ZENIX</td>
                 <td>2019</td>
                <td>Toyota</td>
                <td>Manual</td> 
            </tr>
            <tr>
                <td>2</td>
                <td><strong>D 4D3B 0B</strong></td>
                 <td>JAZZ</td>
                <td>2021</td>
                <td>Honda</td>
                <td>Automatic</td> 
            </tr>
            <tr>
                <td>2</td>
                <td><strong>D 3777 BB </strong></td>
                <td>EXPANDER</td>
                  <td>2015</td>
                <td>Mitsubishi</td>
                <td>Automatic</td> 
            </tr>
        </table>
    </section>

</body>
</html>
